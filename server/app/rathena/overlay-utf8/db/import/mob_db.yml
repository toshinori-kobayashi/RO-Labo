###########################################################################
# Mob 表示名の日本語化（db/mob_db.yml への import オーバーレイ）
###########################################################################
#
# 独自のカタカナ転写による初期セット。全 Mob ではない。追加はこのファイルに追記。
#
# 仕組み:
#   conf/battle/monster.conf の override_mob_names: 2 により、スポーンファイルの
#   表示名ではなく mob_db の JapaneseName が全 Mob の表示名として使われる。
#   そのため spawn ファイルは一切改変しない。
#   既存 Id に対しては Id + JapaneseName だけの記述で上書きできる
#   （src/map/mob.cpp MobDatabase::parseBodyNode。AegisName / Name は既存 Mob では必須ではない）。
#
# 文字コード:
#   このファイルは UTF-8 で管理し、イメージビルド時に iconv で CP932 へ変換して
#   /opt/rathena/db/import/mob_db.yml に配置する。編集は UTF-8 / LF / BOM なしで行うこと。
#
# 記法:
#   値はシングルクォートで囲む。YAML の二重引用符内では "\" がエスケープ扱いとなり、
#   CP932 の 2 バイト目 0x5C（ソ・表・能 など）を含む名前が壊れるため使わないこと。
#
# 文字数:
#   NAME_LENGTH は 24（実質 23 バイト）。CP932 換算で 24 バイトを超える名前は
#   読み込み時に警告が出て切り詰められる。全角カナは 1 文字 2 バイト。
#
###########################################################################

